<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
  <style>
    body {
      font-size: 15px;
      line-height: 1.65;
    }
    main {
      max-width: 34rem;
      margin: 0 auto;
      padding: 4rem 1.25rem 6rem;
    }
    main h1 {
      font-size: 23px;
      margin: 0 0 1.6rem;
    }
    main h2 {
      font-size: 17px;
      margin: 2.5rem 0 0.7rem;
    }
    main h3 {
      font-size: 15px;
      margin: 2.5rem 0 0.7rem;
    }
    main p {
      margin: 0 0 1.15rem;
    }
    .portrait {
      width: 120px;
      height: auto;
      display: block;
      margin: 2.5rem 0 0;
    }
  </style>
</head>
<body>
  <main>
    {{ content }}
  </main>
</body>
</html>
